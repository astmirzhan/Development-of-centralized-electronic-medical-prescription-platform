services:
  postgres:
    image: postgres:16-alpine
    container_name: erx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-erx}
      POSTGRES_USER: ${POSTGRES_USER:-erx_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - erx_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erx_app} -d ${POSTGRES_DB:-erx}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.18.1
    container_name: erx-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src/backend/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-erx_app}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-erx}?sslmode=disable
      - up
    restart: "no"

  api:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: erx-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:-development}
      API_PORT: ${API_PORT:-8080}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-erx}
      POSTGRES_USER: ${POSTGRES_USER:-erx_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-change-me-to-a-long-random-string}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
      QR_TOKEN_ROTATION: ${QR_TOKEN_ROTATION:-60s}
      QR_TOKEN_ACCEPT_WINDOW: ${QR_TOKEN_ACCEPT_WINDOW:-90s}
      NCANODE_URL: ${NCANODE_URL:-http://ncanode:14579}
      NCA_TEST_MODE: ${NCA_TEST_MODE:-true}
      SMS_PROVIDER: ${SMS_PROVIDER:-console}
      SMS_API_KEY: ${SMS_API_KEY:-placeholder}
    ports:
      - "${API_PORT:-8080}:8080"

  ncanode:
    image: ghcr.io/malikzh/ncanode:latest
    container_name: erx-ncanode
    profiles: ["eds"]
    restart: unless-stopped
    ports:
      - "14579:14579"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:14579/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  erx_pg_data:
